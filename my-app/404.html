<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена</title>
    <!-- Подключаем Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJfTAAzji3RoFjrDN0g0zjVpQ5AaX5vQ0gI5hWz6w5lJwS9nfoN7j9BGFz3h" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .error-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #dc3545;
        }
        .error-message {
            font-size: 24px;
            color: #6c757d;
        }
        .btn-back {
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div class="error-container">
    <div class="text-center">
        <div class="error-code">404</div>
        <div class="error-message">Страница не найдена</div>
        <p class="error-message">Кажется, вы заблудились. Страница, которую вы ищете, не существует.</p>
        <a href="/" class="btn btn-primary btn-back">Вернуться на главную</a>
    </div>
</div>

<!-- Подключаем Bootstrap JS (по желанию) -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9gybRgh0KhKkuxhtDE4SvvGZTp1d8S7psM0VbXwmFJy9j/0p/We" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0Ys2v2YseItK5nH5p3y6L1Ubp9VnQgGTpRkCqIlF3fh9hS8b" crossorigin="anonymous"></script>
</body>

</html>
