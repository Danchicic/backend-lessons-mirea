<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

</head>
<body>
<h1>
    ADMIN VIEW
</h1>

<div id="root" class="container">
    <input type="text" id="name" placeholder="Enter card name">
    <input type="text" id="description" placeholder="Enter card description">
    <input type="text" id="price" placeholder="Enter card price">
    <button onclick="createItem()" class="btn btn-primary">Add Item</button>
</div>

<script>
    function createItem() {
        let name = document.getElementById('name').value;
        let description = document.getElementById('description').value;
        let price = document.getElementById('price').value;
        fetch('http://127.0.0.1:8080/items', {
            method: 'POST',
            headers: {
                'accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify([
                {
                    name: name,
                    description: description,
                    price: price,
                }
            ])
        })
    }

    const root = document.getElementById('root');
    function updateCard(domElement) {
        const cardId = domElement.getAttribute('id');
        let name = document.getElementById('name').value;
        let description = document.getElementById('description').value;
        let price = document.getElementById('price').value;
        fetch(`http://127.0.0.1:8080/items/${cardId}`, {
            method: 'PUT',
            headers: {
                'accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                'id': cardId,
                name,
                description,
                price,
            })
        });
    }

    function deleteCard(domElement) {
        const cardId = domElement.getAttribute('id');
        fetch(`http://localhost:8080/items/${cardId}`, {
            method: 'DELETE',
        })
    }

    function createCardByJson(json) {
        let newCard = document.createElement('div');
        newCard.classList.add('card');
        newCard.innerHTML = `
<div class="card-body d-flex flex-row">
<div class="card-text">
<div class="card-text">id: ${json.id}</div>
<div class="card-text">name:${json.name}</div>
<div class="card-text">description:${json.description}</div>
<div class="card-text">price:${json.price}</div>
</div>
<button class="btn btn-danger" id=${json.id} onClick="deleteCard(this)">Delete card</button>
<button class="btn btn-warning" id=${json.id} onClick="updateCard(this)">Change card info</button>
</div>
`
        root.appendChild(newCard);
    }

    fetch('http://localhost:8000/items').then(
        res => res.json()
    ).then(data => {
        console.log(data);
        data.forEach(item => {
            createCardByJson(item);
        })
    })
</script>
</body>

</html>
