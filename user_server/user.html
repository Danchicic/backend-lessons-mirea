<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

</head>
<body>
<script>
    const chatSocket = new WebSocket('ws://localhost:8000/ws');

    chatSocket.onmessage = function (event) {
        const data = JSON.parse(event.data);
        const userChat = document.getElementById('user-chat');
        userChat.innerHTML += `
        <div class="container" id="user-chat-messages">
        ${data}
        </div>
        `
    }

    function sendMessage() {
        console.log("send message", document.getElementById('user-chat-input').value)
        chatSocket.send(JSON.stringify({
            type: 'message',
            message: document.getElementById('user-chat-input').value,
        }))
    }
</script>
<h1>User view</h1>
<div class="container" id="user-chat">
    <input type="text" id="user-chat-input" placeholder="Enter your message here...">
    <button onClick="sendMessage()">Send message</button>

</div>
<div id="root" class="container"></div>

<script>
    const root = document.getElementById('root');

    function createCardByJson(json) {
        let newCard = document.createElement('div');
        newCard.classList.add('card');

        newCard.innerHTML = `
<div class="card-body d-flex flex-row">
<div class="card-text">
<div class="card-text">${json.name}</div>
<div class="card-text">${json.description}</div>
<div class="card-text">${json.price}</div>
</div>

</div>


`
        root.appendChild(newCard);
    }

    fetch('http://127.0.0.1:8000/graphql',
        {
            method: "POST",
            headers: {
                'content-type': 'application/json'
            },
            body: JSON.stringify({"query": "{\n  cards {\n    id\n    name\n    description\n    price\n  }\n}"})
        }).then(
        res => res.json()
    ).then(data => {
        console.log(data);
        data['data']['cards'].forEach(item => {
            createCardByJson(item);
        })
    })
</script>
</body>

</html>
